[package]
name = "racing-memory-desktop"
version = "0.1.0"
description = "Offline Windows companion for Racing Memory"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
base64 = "0.22"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
rand = "0.8"
rfd = "0.15"
sha2 = "0.10"

